# StuNet local dev infrastructure
# Stateful services only — run web/admin/worker via pnpm dev for faster hot reload.
# Usage: docker compose -f infra/docker-compose.yml up -d
#
# ────────────────────────────────────────────────────────────────────────────
# PORT ALLOCATION — conflict-free alongside all other local projects:
#   AI WhatsApp Sales Agent uses: 5432, 6379, 8080, 3001
#   DineFlow uses:                5433, 6380, 9000, 9001, 3000, 3003, 3004, 1025, 8025
#   Backend CIA Project Sem3:     (no known conflicts)
#
#   StuNet uses (safe, non-conflicting):
#     Postgres  → host 5434 → container 5432
#     Redis     → host 6382 → container 6379
#     Mailpit   → host 1026/8026 → container 1025/8025
#     web app   → host 3010  (Next.js dev)
#     admin app → host 3011  (Next.js dev)
# ────────────────────────────────────────────────────────────────────────────

name: stunet

services:
  postgres:
    container_name: stunet_postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: stunet
      POSTGRES_USER: stunet_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-localdevonly}
    volumes:
      - stunet_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stunet_owner -d stunet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - stunet_network

  redis:
    container_name: stunet_redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - stunet_redis_data:/data
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - stunet_network

  mail:
    container_name: stunet_mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1026:1025"   # SMTP  → smtp://localhost:1026
      - "8026:8025"   # Web UI → http://localhost:8026
    networks:
      - stunet_network

volumes:
  stunet_postgres_data:
  stunet_redis_data:

networks:
  stunet_network:
    driver: bridge
